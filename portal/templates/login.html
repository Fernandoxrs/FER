{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<section class="tarjeta estrecha">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Usuario <input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <button class="primario">Entrar</button>
  </form>
  {% if registro_abierto() %}
    <p class="apagado">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
  {% endif %}
</section>
{% endblock %}
